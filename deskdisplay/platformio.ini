; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = guition-4848s040

[env:guition-4848s040]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Guition ESP32-S3-4848S040
; 16 MiB Quad flash + 8 MiB Octal PSRAM

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

board_build.extra_flags =
    -DBOARD_HAS_PSRAM

lib_deps =
    lovyan03/LovyanGFX

upload_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
upload_speed = 921600

monitor_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
monitor_speed = 115200

; Optional networking build; even here the radio starts only on explicit request.
[env:guition-4848s040-wifi]
extends = env:guition-4848s040
build_flags = -DDESKDISPLAY_WIFI=1

; Advertising-only BLE tests. Both radios remain inactive until commanded.
[env:guition-4848s040-ble]
extends = env:guition-4848s040
build_flags = -DDESKDISPLAY_BLE=1

[env:guition-4848s040-wifi-ble]
extends = env:guition-4848s040
build_flags =
    -DDESKDISPLAY_WIFI=1
    -DDESKDISPLAY_BLE=1
