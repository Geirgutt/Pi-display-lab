---
- name: Installer Pi Display Lab cluster-workers
  hosts: cluster_workers
  gather_facts: true
  strategy: linear
  any_errors_fatal: true
  vars:
    ansible_become_password: "{{ lookup('worker_sudo', inventory_hostname, socket_path=worker_sudo_socket) if worker_sudo_socket is defined else '' }}"
    # Disabled unless the controller config explicitly selects one worker.
    deskdisplay_enabled: false
    deskdisplay_worker: ""
    deskdisplay_port: 4567
    deskdisplay_psk_file: /etc/pi-display-lab/deskdisplay-peer.psk
    deskdisplay_build_packages: []
    deskdisplay_packages_before_build: []
    deskdisplay_build_packages_to_remove: []

  pre_tasks:
    - name: Avvis root som vanlig tjenestebruker
      ansible.builtin.assert:
        that:
          - ansible_facts['user_uid'] | int != 0
        fail_msg: "Workerne må installeres med en vanlig SSH-bruker, ikke root."

    # Dette kjøres på alle hosts før første endrende oppgave. Feil sudo-passord
    # stopper dermed utrullingen før apt, Git eller systemd blir endret.
    - name: Kontroller sudo/become før endringer
      become: true
      ansible.builtin.command:
        argv:
          - /usr/bin/true
      changed_when: false

    - name: Kontroller at credential tilhører workerens hostname
      ansible.builtin.assert:
        that:
          - worker_credentials[inventory_hostname]['worker_id'] == ansible_facts['hostname']
        fail_msg: "Worker-hostname endret seg etter preflight; installasjonen stoppes."
      no_log: true

  tasks:
    - name: Finn eventuell gammel DeskDisplay-tjeneste på ikke-valgt worker
      ansible.builtin.service_facts:
      when: not deskdisplay_enabled | bool or inventory_hostname != deskdisplay_worker

    - name: Stopp DeskDisplay-tjenesten på ikke-valgt worker
      become: true
      ansible.builtin.systemd:
        name: deskdisplay-secure-peer.service
        enabled: false
        state: stopped
      when:
        - not deskdisplay_enabled | bool or inventory_hostname != deskdisplay_worker
        - "'deskdisplay-secure-peer.service' in ansible_facts.services"

    - name: Velg sikre senderens byggepakker
      ansible.builtin.set_fact:
        deskdisplay_build_packages: >-
          {{ ['gcc', 'libssl-dev'] if ansible_facts['os_family'] == 'Debian'
             else ['gcc', 'openssl-devel'] }}
      when: deskdisplay_enabled | bool and inventory_hostname == deskdisplay_worker

    - name: Installer systempakker
      become: true
      ansible.builtin.package:
        name: "{{ ['git', 'python3', 'python3-packaging'] + (['python3-venv'] if ansible_facts['os_family'] == 'Debian' else ['python3-pip']) }}"
        state: present
        update_cache: true

    - name: Registrer installert pakkegrunnlag før secure-peer-bygget
      ansible.builtin.package_facts:
        manager: auto
      when: deskdisplay_enabled | bool and inventory_hostname == deskdisplay_worker

    - name: Lagre pakker som skal beholdes etter secure-peer-bygget
      ansible.builtin.set_fact:
        deskdisplay_packages_before_build: "{{ ansible_facts.get('packages', {}).keys() | list }}"
      when: deskdisplay_enabled | bool and inventory_hostname == deskdisplay_worker

    - name: Installer midlertidige secure-peer-byggepakker
      become: true
      ansible.builtin.package:
        name: "{{ deskdisplay_build_packages }}"
        state: present
      when: deskdisplay_enabled | bool and inventory_hostname == deskdisplay_worker

    - name: Hent eksakt controller-revisjon av Pi-display-lab
      ansible.builtin.git:
        repo: "{{ project_repository }}"
        dest: "{{ ansible_facts['user_dir'] }}/Pi-display-lab"
        version: "{{ project_version }}"
        update: true

    - name: Les installert worker-revisjon
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ ansible_facts['user_dir'] }}/Pi-display-lab"
          - rev-parse
          - HEAD
      register: worker_revision
      changed_when: false

    - name: Kontroller at worker og controller er identiske
      ansible.builtin.assert:
        that:
          - worker_revision.stdout == project_version
        fail_msg: "Workeren fikk ikke controllerens eksakte Git-revisjon."

    - name: Opprett virtuelt Python-miljø
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -m
          - venv
          - "{{ ansible_facts['user_dir'] }}/Pi-display-lab/.venv"
        creates: "{{ ansible_facts['user_dir'] }}/Pi-display-lab/.venv/bin/python"

    - name: Installer Python-avhengigheter
      ansible.builtin.pip:
        requirements: "{{ ansible_facts['user_dir'] }}/Pi-display-lab/requirements.txt"
        virtualenv: "{{ ansible_facts['user_dir'] }}/Pi-display-lab/.venv"

    - name: Skriv lokal worker-konfigurasjon
      ansible.builtin.copy:
        dest: "{{ ansible_facts['user_dir'] }}/Pi-display-lab/config.local.json"
        mode: "0600"
        content: |
          {
            "node_role": "worker",
            "controller_host": "{{ controller_host }}",
            "worker_hosts": [],
            "ssh_user": "",
            "coordinator_port": {{ coordinator_port }},
            "app_port": {{ app_port }},
            "node_heartbeat_auth": {{ 'true' if node_heartbeat_enabled else 'false' }},
            "cluster": {
              "enabled": true,
              "coordinator_url": "https://{{ controller_host }}:{{ coordinator_port }}",
              "poll_interval_seconds": {{ worker_poll_interval }},
              "worker_slots": {{ ansible_facts['processor_vcpus'] | default(ansible_facts['processor_count'] | default(0)) }},
              "credentials_file": "{{ cluster_credentials_file }}",
              "tls_enabled": true,
              "ca_certificate_file": "{{ cluster_ca_file }}",
              "server_certificate_file": "/etc/pi-display-lab/pki/coordinator.crt",
              "server_key_file": "/etc/pi-display-lab/pki/coordinator.key"
            }
          }

    - name: Opprett privat credential-mappe
      become: true
      ansible.builtin.file:
        path: "{{ cluster_credentials_file | dirname }}"
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0700"

    - name: Gi workeren bare sin egen cluster-credential
      become: true
      ansible.builtin.copy:
        dest: "{{ cluster_credentials_file }}"
        owner: "{{ ansible_user }}"
        mode: "0600"
        content: |
          {
            "version": 1,
            "worker_id": {{ worker_credentials[inventory_hostname]['worker_id'] | to_json }},
            "worker_token": {{ worker_credentials[inventory_hostname]['worker_token'] | to_json }}
          }
      no_log: true

    - name: Opprett mappe for offentlig cluster-CA
      become: true
      ansible.builtin.file:
        path: "{{ cluster_ca_file | dirname }}"
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0700"

    - name: Installer bare det offentlige CA-sertifikatet
      become: true
      ansible.builtin.copy:
        dest: "{{ cluster_ca_file }}"
        owner: "{{ ansible_user }}"
        mode: "0644"
        content: "{{ cluster_ca_certificate }}"

    - name: Opprett mappe for valgfri heartbeat-credential
      become: true
      ansible.builtin.file:
        path: /etc/pi-display-lab
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0700"
      when: node_heartbeat_enabled | bool

    - name: Installer valgfri heartbeat-credential
      become: true
      ansible.builtin.copy:
        dest: /etc/pi-display-lab/node-heartbeat.env
        owner: "{{ ansible_user }}"
        mode: "0600"
        content: "PI_DISPLAY_NODE_TOKEN={{ node_heartbeat_token }}\n"
      when: node_heartbeat_enabled | bool
      no_log: true

    - name: Opprett runtime-mappe for DeskDisplay-senderen
      become: true
      ansible.builtin.file:
        path: /usr/local/libexec/pi-display-lab
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: deskdisplay_enabled | bool and inventory_hostname == deskdisplay_worker

    - name: Bygg den kanoniske secure_peer-senderen lokalt på workeren
      become: true
      ansible.builtin.command:
        argv:
          - gcc
          - -O2
          - -Wall
          - -Wextra
          - -o
          - /usr/local/libexec/pi-display-lab/secure_peer
          - "{{ ansible_facts['user_dir'] }}/Pi-display-lab/deskdisplay/tools/secure_peer.c"
          - -lssl
          - -lcrypto
      register: deskdisplay_build
      failed_when: false
      when: deskdisplay_enabled | bool and inventory_hostname == deskdisplay_worker

    - name: Beskytt secure_peer-runtimefilen
      become: true
      ansible.builtin.file:
        path: /usr/local/libexec/pi-display-lab/secure_peer
        owner: root
        group: root
        mode: "0755"
      when:
        - deskdisplay_enabled | bool
        - inventory_hostname == deskdisplay_worker
        - deskdisplay_build is defined and deskdisplay_build.rc == 0

    - name: Installer DeskDisplay-PSK uten å overskrive en eksisterende lokal PSK
      become: true
      ansible.builtin.copy:
        dest: "{{ deskdisplay_psk_file }}"
        owner: "{{ ansible_user }}"
        mode: "0600"
        content: "{{ deskdisplay_peer_psk }}\n"
        force: false
      when:
        - deskdisplay_enabled | bool
        - inventory_hostname == deskdisplay_worker
        - deskdisplay_build is defined and deskdisplay_build.rc == 0
      no_log: true

    - name: Installer DeskDisplay secure-peer.service
      become: true
      ansible.builtin.copy:
        dest: /etc/systemd/system/deskdisplay-secure-peer.service
        mode: "0644"
        content: |
          [Unit]
          Description=Pi Display Lab DeskDisplay secure telemetry peer
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=simple
          User={{ ansible_user }}
          ExecStart=/usr/local/libexec/pi-display-lab/secure_peer --listen 0.0.0.0 --port {{ deskdisplay_port }} --psk-file {{ deskdisplay_psk_file }}
          Restart=always
          RestartSec=5
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectHome=true
          ProtectSystem=strict
          ProtectKernelTunables=true
          ProtectControlGroups=true
          RestrictSUIDSGID=true
          UMask=0077

          [Install]
          WantedBy=multi-user.target
      when:
        - deskdisplay_enabled | bool
        - inventory_hostname == deskdisplay_worker
        - deskdisplay_build is defined and deskdisplay_build.rc == 0

    - name: Oppdater pakkelisten etter secure-peer-bygget
      ansible.builtin.package_facts:
        manager: auto
      when: deskdisplay_enabled | bool and inventory_hostname == deskdisplay_worker

    - name: Finn alle pakker som bare kom inn for secure-peer-bygget
      ansible.builtin.set_fact:
        deskdisplay_build_packages_to_remove: >-
          {{ ansible_facts.get('packages', {}).keys()
             | difference(deskdisplay_packages_before_build) | list }}
      when: deskdisplay_enabled | bool and inventory_hostname == deskdisplay_worker

    - name: Fjern midlertidige secure-peer-byggepakker
      become: true
      ansible.builtin.package:
        name: "{{ deskdisplay_build_packages_to_remove }}"
        state: absent
      when:
        - deskdisplay_enabled | bool
        - inventory_hostname == deskdisplay_worker
        - deskdisplay_build_packages_to_remove | length > 0

    - name: Stopp hvis secure-peer-byggingen feilet
      ansible.builtin.assert:
        that:
          - deskdisplay_build.rc == 0
        fail_msg: "Den kanoniske secure_peer-senderen kunne ikke bygges på workeren."
      when:
        - deskdisplay_enabled | bool
        - inventory_hostname == deskdisplay_worker
        - deskdisplay_build is defined

    - name: Installer cluster-worker.service
      become: true
      ansible.builtin.copy:
        dest: /etc/systemd/system/cluster-worker.service
        mode: "0644"
        content: |
          [Unit]
          Description=Pi Display Lab cluster worker
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=simple
          User={{ ansible_user }}
          WorkingDirectory={{ ansible_facts['user_dir'] }}/Pi-display-lab
          ExecStart={{ ansible_facts['user_dir'] }}/Pi-display-lab/.venv/bin/python {{ ansible_facts['user_dir'] }}/Pi-display-lab/cluster_worker.py
          Restart=always
          RestartSec=3
          Environment=PYTHONUNBUFFERED=1
          NoNewPrivileges=true
          PrivateTmp=true
          UMask=0077

          [Install]
          WantedBy=multi-user.target

    - name: Installer node-agenttjenesten
      become: true
      ansible.builtin.copy:
        dest: /etc/systemd/system/pi-display-node-agent.service
        mode: "0644"
        content: |
          [Unit]
          Description=Pi Display Lab node agent
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=simple
          User={{ ansible_user }}
          WorkingDirectory={{ ansible_facts['user_dir'] }}/Pi-display-lab
          ExecStart={{ ansible_facts['user_dir'] }}/Pi-display-lab/.venv/bin/python {{ ansible_facts['user_dir'] }}/Pi-display-lab/node_agent.py --server http://{{ controller_host }}:{{ app_port }}
          Restart=always
          RestartSec=5
          Environment=PYTHONUNBUFFERED=1
          EnvironmentFile=-/etc/default/pi-display-lab-agent
          EnvironmentFile=-/etc/pi-display-lab/node-heartbeat.env
          NoNewPrivileges=true
          PrivateTmp=true
          UMask=0077

          [Install]
          WantedBy=multi-user.target

    - name: Last systemd på nytt
      become: true
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Start DeskDisplay secure-peer-tjenesten
      become: true
      ansible.builtin.systemd:
        name: deskdisplay-secure-peer.service
        enabled: true
        state: restarted
      when: deskdisplay_enabled | bool and inventory_hostname == deskdisplay_worker

    - name: Start worker-tjenestene
      become: true
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: restarted
      loop:
        - cluster-worker.service
        - pi-display-node-agent.service

    - name: Verifiser HTTPS, CA, vertsnavn og worker-identitet
      ansible.builtin.command:
        argv:
          - "{{ ansible_facts['user_dir'] }}/Pi-display-lab/.venv/bin/python"
          - "{{ ansible_facts['user_dir'] }}/Pi-display-lab/scripts/verify-worker.py"
          - "{{ ansible_facts['user_dir'] }}/Pi-display-lab/config.local.json"
      changed_when: false
