---
# Validate the entire selection before changing packages on any worker.
- name: Kontroller valgte workers før OS-vedlikehold
  hosts: cluster_workers
  gather_facts: true
  strategy: linear
  any_errors_fatal: true
  vars:
    ansible_become_password: "{{ lookup('worker_sudo', inventory_hostname, socket_path=worker_sudo_socket) }}"
    ansible_ssh_timeout: 60
  tasks:
    - name: Kontroller at noden bruker Debian, Ubuntu, Raspberry Pi OS eller Fedora
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Debian' or ansible_facts['distribution'] == 'Fedora'
          - ansible_facts['os_family'] == 'Debian' or ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
        fail_msg: "OS-vedlikeholdet støtter Debian, Ubuntu, Raspberry Pi OS (apt) og Fedora (dnf)."

    - name: Kontroller sudo før pakkeendringer
      become: true
      ansible.builtin.command:
        argv: [/usr/bin/true]
      changed_when: false

- name: Vedlikehold OS-pakker i grupper av workers
  hosts: cluster_workers
  gather_facts: false
  serial: "{{ maintenance_parallel | default(3) | int }}"
  any_errors_fatal: true
  vars:
    ansible_become_password: "{{ lookup('worker_sudo', inventory_hostname, socket_path=worker_sudo_socket) }}"
    ansible_ssh_timeout: 60
  tasks:
    - name: Velg pakkevedlikehold for operativsystemet
      ansible.builtin.include_tasks:
        file: "{{ 'maintenance-debian.yml' if ansible_facts['os_family'] == 'Debian' else 'maintenance-fedora.yml' }}"
