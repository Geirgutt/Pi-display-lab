---
# Validate the entire selection before changing packages on any worker.
- name: Kontroller valgte workers før OS-vedlikehold
  hosts: cluster_workers
  gather_facts: true
  strategy: linear
  any_errors_fatal: true
  vars:
    ansible_become_password: "{{ lookup('worker_sudo', inventory_hostname, socket_path=worker_sudo_socket) }}"
    ansible_become_timeout: 60
  tasks:
    - name: Kontroller at noden bruker Debian, Ubuntu eller Raspberry Pi OS
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Debian'
        fail_msg: "OS-vedlikeholdet krever apt (Debian, Ubuntu eller Raspberry Pi OS)."

    - name: Kontroller sudo før pakkeendringer
      become: true
      ansible.builtin.command:
        argv: [/usr/bin/true]
      changed_when: false

- name: Vedlikehold OS-pakker i grupper av workers
  hosts: cluster_workers
  gather_facts: false
  serial: "{{ maintenance_parallel | default(3) | int }}"
  any_errors_fatal: true
  vars:
    ansible_become_password: "{{ lookup('worker_sudo', inventory_hostname, socket_path=worker_sudo_socket) }}"
    ansible_become_timeout: 60
  tasks:
    - name: "[1/7] Oppdater pakkelister"
      become: true
      ansible.builtin.apt:
        update_cache: true
        lock_timeout: 300
      register: maintenance_refresh

    - name: "[2/7] Registrer installerte pakker før oppgradering"
      become: true
      ansible.builtin.command:
        expand_argument_vars: false
        argv:
          - dpkg-query
          - -W
          - '-f=${db:Status-Status}\t${binary:Package}\t${Version}\n'
      changed_when: false
      register: maintenance_before

    - name: "[3/7] Finn tilgjengelige pakkeoppgraderinger"
      ansible.builtin.command:
        argv:
          - apt
          - list
          - --upgradable
      environment:
        LC_ALL: C
      changed_when: false
      register: maintenance_available

    - name: "[4/7] Oppgrader installerte pakker uten å fjerne pakker"
      become: true
      ansible.builtin.apt:
        upgrade: safe
        force_apt_get: true
        fail_on_autoremove: true
        lock_timeout: 300
      when: maintenance_upgrade | default(false) | bool
      register: maintenance_upgrade_result

    - name: "[5/7] Registrer installerte pakker etter oppgradering"
      become: true
      ansible.builtin.command:
        expand_argument_vars: false
        argv:
          - dpkg-query
          - -W
          - '-f=${db:Status-Status}\t${binary:Package}\t${Version}\n'
      changed_when: false
      when: maintenance_upgrade | default(false) | bool
      register: maintenance_after

    - name: "[6/7] Finn gjenstående pakkeoppgraderinger"
      ansible.builtin.command:
        argv:
          - apt
          - list
          - --upgradable
      environment:
        LC_ALL: C
      changed_when: false
      when: maintenance_upgrade | default(false) | bool
      register: maintenance_remaining

    - name: "[7/7] Se om noden trenger omstart"
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: maintenance_reboot
