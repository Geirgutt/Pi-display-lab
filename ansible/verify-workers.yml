---
- name: Verifiser Pi Display Lab cluster-workers
  hosts: cluster_workers
  gather_facts: false
  become: false
  pre_tasks:
    - name: Finn workerens hjemmemappe
      # raw does not stage a Python module in ~/.ansible/tmp. These read-only
      # checks must also work when Ansible's remote staging path is unavailable.
      ansible.builtin.raw: printf '%s\n' "$HOME"
      register: worker_home
      changed_when: false
  tasks:
    - name: Les workerens Git-revisjon
      ansible.builtin.raw: >-
        git -C {{ ((worker_home.stdout | trim) ~ '/Pi-display-lab') | quote }} rev-parse HEAD
      register: worker_revision
      changed_when: false

    - name: Krev samme commit som controlleren
      ansible.builtin.assert:
        that:
          - worker_revision.stdout | trim == project_version
        fail_msg: "Workeren kjører ikke controllerens eksakte Git-revisjon."

    - name: Les worker-tjenestenes status
      ansible.builtin.raw: systemctl is-active {{ item | quote }}
      loop:
        - cluster-worker.service
        - pi-display-node-agent.service
      changed_when: false

    - name: Verifiser HTTPS/CA og worker-identitet
      ansible.builtin.raw: >-
        {{ ((worker_home.stdout | trim) ~ '/Pi-display-lab/.venv/bin/python') | quote }} -B
        {{ ((worker_home.stdout | trim) ~ '/Pi-display-lab/scripts/verify-worker.py') | quote }}
        {{ ((worker_home.stdout | trim) ~ '/Pi-display-lab/config.local.json') | quote }}
      changed_when: false
